#leo-clinica-refinada .finance-summary h3{margin:0;color:#1e3a5f;font-size:17px}
#leo-clinica-refinada .summary-title{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:20px}
#leo-clinica-refinada .finance-summary .money{text-align:right;font-variant-numeric:tabular-nums}
#leo-clinica-refinada .total-line{display:flex;justify-content:space-between;border-top:1px solid #e2e8f0;padding-top:18px;margin-top:12px;color:#1e3a5f;font-weight:500}
</style>


<style>
#leo-clinica-refinada .period-controls{display:flex;gap:12px;align-items:end;flex-wrap:wrap;padding:16px;border-bottom:1px solid #e2e8f0;background:white}
#leo-clinica-refinada .period-controls label{display:grid;gap:6px;font-size:12px;color:#526277}
#leo-clinica-refinada .period-controls input,#leo-clinica-refinada .period-controls select{width:auto;max-width:100%;font:inherit;border:1px solid #e2e8f0;border-radius:7px;padding:9px;background:white;color:#1e3a5f}
#leo-clinica-refinada .period-controls .dates{width:140px}
#leo-clinica-refinada [hidden]{display:none!important}
#leo-clinica-refinada .summary-row{display:grid;grid-template-columns:1fr 70px 110px 110px;gap:12px;padding:15px 0;border-top:1px solid #e2e8f0;align-items:center}
#leo-clinica-refinada .summary-row span:not(:first-child){text-align:right;font-variant-numeric:tabular-nums}
@media(max-width:600px){#leo-clinica-refinada .summary-row{grid-template-columns:1fr 45px 80px 80px;gap:5px;font-size:12px}}
</style>


<style>
#leo-clinica-refinada .clinic-tabs{display:flex;gap:8px;flex-wrap:wrap;padding:16px;border-bottom:1px solid #e2e8f0}
#leo-clinica-refinada .clinic-tabs button{border:0;background:transparent}
#leo-clinica-refinada .clinic-tabs button[aria-selected=true]{background:#eef2f8;color:#1e3a5f}
#leo-clinica-refinada .clinic-panel{padding:28px}
#leo-clinica-refinada .clinic-panel h3{font-size:19px;color:#1e3a5f;margin:0 0 8px}
#leo-clinica-refinada .clinic-panel h4{font-size:14px;color:#1e3a5f;margin:28px 0 18px}
#leo-clinica-refinada .clinic-grid{display:grid;grid-template-columns:1fr 1fr;gap:22px;margin:24px 0}
#leo-clinica-refinada .clinic-grid label{display:grid;gap:8px;font-size:13px;color:#526277}
#leo-clinica-refinada .clinic-grid input{border:1px solid #d5dfeb;border-radius:8px;padding:11px;color:#1e3a5f;width:100%;min-width:0}
#leo-clinica-refinada .clinic-row{display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;padding:20px 0;border-bottom:1px solid #e2e8f0}
#leo-clinica-refinada .clinic-row .lead{display:flex;gap:12px;align-items:center}
#leo-clinica-refinada .clinic-actions{display:flex;gap:10px;justify-content:flex-end;flex-wrap:wrap;margin-top:26px}
#leo-clinica-refinada .clinic-note{font-size:12px;color:#64748b;margin-top:20px}
@media(max-width:550px){#leo-clinica-refinada .clinic-grid{grid-template-columns:1fr}#leo-clinica-refinada .clinic-panel{padding:18px}}
</style>
<script>
(()=>{
const root=document.getElementById('leo-clinica-refinada');const panel=root.querySelector('.clinic-panel');const tabs=root.querySelector('.clinic-tabs');
const icon=name=>'<i data-lucide="'+name+'" aria-hidden="true"></i>';
const row=(symbol,title,sub,action)=>'<div class="clinic-row"><div class="lead">'+icon(symbol)+'<div><span class="name">'+title+'</span><div class="secondary">'+sub+'</div></div></div><button type="button" data-demo="'+action+'">'+action+'</button></div>';
const pages={
local:'<h3>Dados do local</h3><div class="sub">Informações cadastrais e identidade nos laudos.</div><div class="clinic-grid"><label>Nome do local<input value="Clínica demonstração"></label><label>Razão social<input placeholder="Não informada"></label><label>CNPJ<input placeholder="Não informado"></label><label>Telefone<input placeholder="Não informado"></label><label>E-mail<input type="email" placeholder="Não informado"></label><label>Endereço<input placeholder="Não informado"></label></div><h4>Identidade nos laudos</h4>'+row('image','Logotipo do local','Marca utilizada nos documentos da clínica.','Enviar logotipo')+row('file-text','Timbre dos laudos','A identidade do documento é independente da interface do LEO.','Configurar timbre')+'<div class="clinic-actions"><button type="button" class="primary" data-demo="Salvar alterações">'+icon('save')+'Salvar alterações</button></div>',
team:'<h3>Equipe</h3><div class="sub">Pessoas com acesso a este local.</div>'+row('user-round','Médico demonstração','Responsável pelo local · perfil demonstrativo','Ver permissões')+row('user-round','Recepção demonstração','Acesso administrativo · perfil demonstrativo','Ver permissões')+'<div class="clinic-actions"><button type="button" class="primary" data-demo="Convidar membro">'+icon('user-round-plus')+'Convidar membro</button></div>',
types:'<h3>Tipos de exame</h3><div class="sub">Exames disponíveis e forma de elaboração do laudo.</div>'+row('monitor','Ecocardiograma transtorácico','Laudo pelo motor clínico','Configurar')+row('waves','Doppler de carótidas','Laudo em texto','Configurar')+row('activity','Eletrocardiograma','Anexo PDF do aparelho','Configurar')+row('chart-no-axes-combined','MAPA','Anexo PDF do aparelho','Configurar')+row('history','Holter','Anexo PDF do aparelho','Configurar')+row('footprints','Teste ergométrico','Anexo PDF do aparelho','Configurar')+'<div class="clinic-actions"><button type="button" data-demo="Adicionar tipo de exame">'+icon('plus')+'Adicionar tipo</button></div>',
plan:'<h3>Plano e franquia</h3><div class="sub">Plano contratado e utilização do ciclo.</div>'+row('credit-card','Plano do local','Informações do contrato serão exibidas aqui.','Ver detalhes')+row('file-text','Franquia de laudos','Consumo e saldo do ciclo serão exibidos com os dados reais.','Ver utilização')+'<p class="clinic-note">Prévia visual sem plano, preço ou consumo reais.</p>'};
function show(key){panel.innerHTML=pages[key];tabs.querySelectorAll('button').forEach(b=>b.setAttribute('aria-selected',String(b.dataset.tab===key)));panel.setAttribute('role','tabpanel');panel.id='clinic-panel';panel.setAttribute('aria-labelledby','clinic-tab-'+key);if(globalThis.lucide)lucide.createIcons({attrs:{width:16,height:16}});}
[['local','building-2','Dados do local'],['team','users-round','Equipe'],['types','list-tree','Tipos de exame'],['plan','credit-card','Plano e franquia']].forEach(([key,symbol,label])=>{const b=document.createElement('button');b.type='button';b.id='clinic-tab-'+key;b.dataset.tab=key;b.setAttribute('role','tab');b.setAttribute('aria-controls','clinic-panel');b.innerHTML=icon(symbol)+label;b.onclick=()=>show(key);tabs.append(b);});
root.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;if(b.dataset.demo)root.querySelector('[role=status]').textContent=b.dataset.demo+' — ação ilustrativa; nenhuma alteração será salva nesta prévia.';if(b.classList.contains('mobile-menu')){const open=root.querySelector('.shell').classList.toggle('menu-open');b.setAttribute('aria-expanded',String(open));}});show('local');
})();
</script>

<style>
#leo-clinica-refinada .clinic-section{padding:8px 0 24px;border-bottom:1px solid #e2e8f0}
#leo-clinica-refinada .clinic-section h4{margin:24px 0 8px}
#leo-clinica-refinada .clinic-section .clinic-grid{margin:18px 0 0}
#leo-clinica-refinada .letterhead-preview{margin:20px 0;background:#fafbfd;border:1px solid #e2e8f0;padding:24px;border-radius:10px}
#leo-clinica-refinada .letterhead-paper{background:white;border:1px solid #e2e8f0;padding:26px;color:#526277}
#leo-clinica-refinada .letterhead-name{font-size:18px;font-weight:500;color:#8b1a1a;padding-bottom:12px;border-bottom:2px solid #8b1a1a;overflow-wrap:anywhere}
#leo-clinica-refinada .letterhead-contact{font-size:12px;padding-top:10px;overflow-wrap:anywhere}
#leo-clinica-refinada .pending-changes{font-size:12px;color:#64748b;margin-right:auto;align-self:center}
#leo-clinica-refinada .clinic-actions[hidden]{display:none!important}
</style>
<script>
(()=>{
const root=document.getElementById('leo-clinica-refinada');const panel=root.querySelector('.clinic-panel');
function refine(){
if(panel.querySelector('.clinic-section'))return;
const active=root.querySelector('.clinic-tabs [aria-selected=true]');
if(active.dataset.tab==='team'){panel.querySelectorAll('.clinic-row .secondary').forEach(el=>{el.textContent+=' · Ativo';});return;}
if(active.dataset.tab!=='local')return;
const grid=panel.querySelector('.clinic-grid');const labels=Array.from(grid.children);const sections=document.createElement('div');
[['Cadastro',[0,1,2]],['Contato e endereço',[3,4,5]]].forEach(([title,indices])=>{const section=document.createElement('section');section.className='clinic-section';const heading=document.createElement('h4');heading.textContent=title;const fields=document.createElement('div');fields.className='clinic-grid';indices.forEach(i=>fields.append(labels[i]));section.append(heading,fields);sections.append(section);});grid.replaceWith(sections);
const preview=document.createElement('div');preview.className='letterhead-preview';preview.setAttribute('aria-label','Prévia ilustrativa do cabeçalho do laudo');preview.innerHTML='<div class="letterhead-paper"><div class="letterhead-name"></div><div class="letterhead-contact"></div></div><p class="clinic-note">Cabeçalho ilustrativo · a cor do documento continua independente do azul da plataforma.</p>';
const identityHeading=Array.from(panel.querySelectorAll('h4')).find(x=>x.textContent==='Identidade nos laudos');identityHeading.after(preview);
const actions=panel.querySelector('.clinic-actions');actions.hidden=true;const pending=document.createElement('span');pending.className='pending-changes';pending.textContent='Alterações ainda não salvas';actions.prepend(pending);
const inputs=Array.from(panel.querySelectorAll('input'));let saved=inputs.map(x=>x.value);
function update(){preview.querySelector('.letterhead-name').textContent=inputs[0].value||'Nome do local';preview.querySelector('.letterhead-contact').textContent=[inputs[5].value,inputs[3].value,inputs[4].value].filter(Boolean).join(' · ')||'Endereço e contatos aparecerão aqui';actions.hidden=!inputs.some((x,i)=>x.value!==saved[i]);}
inputs.forEach(x=>x.addEventListener('input',update));
const save=actions.querySelector('button');save.addEventListener('click',()=>{saved=inputs.map(x=>x.value);update();});update();
}
refine();root.querySelector('.clinic-tabs').addEventListener('click',()=>{refine();});
})();
</script>
