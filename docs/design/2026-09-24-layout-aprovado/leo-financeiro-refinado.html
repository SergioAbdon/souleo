#leo-financeiro-refinado .layout-choices{display:none}
#leo-financeiro-refinado .unified-toolbar{display:grid;grid-template-columns:minmax(150px,1.3fr) minmax(130px,1fr) minmax(120px,1fr) minmax(110px,.9fr);gap:8px;align-items:center;padding:16px;border-bottom:1px solid #e2e8f0;background:white}
#leo-financeiro-refinado .unified-toolbar .searchrow{padding:0;border:0;gap:8px;min-width:0}
#leo-financeiro-refinado .unified-toolbar label{min-width:0}
#leo-financeiro-refinado .unified-toolbar select{width:100%;max-width:none;min-width:0;padding:9px 7px;font-size:12px}
#leo-financeiro-refinado .unified-toolbar input{font-size:12px}
@media(max-width:850px){#leo-financeiro-refinado .unified-toolbar{grid-template-columns:repeat(3,minmax(0,1fr))}#leo-financeiro-refinado .unified-toolbar .searchrow{grid-column:1/-1;padding-bottom:8px}}
@media(max-width:450px){#leo-financeiro-refinado .unified-toolbar{grid-template-columns:1fr}#leo-financeiro-refinado .unified-toolbar select{font-size:14px}}
</style>


<style>
#leo-financeiro-refinado .finance-summary{margin-top:24px;padding:22px;background:white;border:1px solid #e2e8f0;border-radius:12px}
#leo-financeiro-refinado .finance-summary h3{margin:0;color:#1e3a5f;font-size:17px}
#leo-financeiro-refinado .summary-title{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:20px}
#leo-financeiro-refinado .finance-summary .money{text-align:right;font-variant-numeric:tabular-nums}
#leo-financeiro-refinado .total-line{display:flex;justify-content:space-between;border-top:1px solid #e2e8f0;padding-top:18px;margin-top:12px;color:#1e3a5f;font-weight:500}
</style>


<style>
#leo-financeiro-refinado .period-controls{display:flex;gap:12px;align-items:end;flex-wrap:wrap;padding:16px;border-bottom:1px solid #e2e8f0;background:white}
#leo-financeiro-refinado .period-controls label{display:grid;gap:6px;font-size:12px;color:#526277}
#leo-financeiro-refinado .period-controls input,#leo-financeiro-refinado .period-controls select{width:auto;max-width:100%;font:inherit;border:1px solid #e2e8f0;border-radius:7px;padding:9px;background:white;color:#1e3a5f}
#leo-financeiro-refinado .period-controls .dates{width:140px}
#leo-financeiro-refinado [hidden]{display:none!important}
#leo-financeiro-refinado .summary-row{display:grid;grid-template-columns:1fr 70px 110px 110px;gap:12px;padding:15px 0;border-top:1px solid #e2e8f0;align-items:center}
#leo-financeiro-refinado .summary-row span:not(:first-child){text-align:right;font-variant-numeric:tabular-nums}
@media(max-width:600px){#leo-financeiro-refinado .summary-row{grid-template-columns:1fr 45px 80px 80px;gap:5px;font-size:12px}}
</style>
<script>
(()=>{
const root=document.getElementById('leo-financeiro-refinado');
const data=[['Ana Martins','Eco transtorácico','Particular','2026-09-02','2026-09-03',180],['Carlos Lima','Eco transtorácico','Unimed','2026-09-03','2026-09-04',120],['Beatriz Costa','Doppler de carótidas','Particular','2026-09-04','2026-09-05',180],['Rafael Souza','ECG','Unimed','2026-08-31','2026-09-01',120],['Helena Duarte','Eco transtorácico','Particular','2026-09-07','2026-09-08',180],['Paulo Ribeiro','ECG','Unimed','2026-09-08','2026-09-08',120]];
const workspace=root.querySelector('.workspace');root.querySelector('.report-filters').remove();
const controls=document.createElement('div');controls.className='period-controls';controls.innerHTML='<label>Consultar por<select data-basis><option value="3">Data do exame</option><option value="4">Data de emissão</option></select></label><label>De<input class="dates" data-from type="date" value="2026-09-01"></label><label>Até<input class="dates" data-to type="date" value="2026-09-08"></label><label>Convênio<select data-plan><option value="">Todos</option>Particular<option>Particular</option><option>Unimed</option></select></label><label>Exame<select data-type><option value="">Todos</option><option>Eco transtorácico</option><option>Doppler de carótidas</option><option>ECG</option></select></label>';
workspace.insertBefore(controls,workspace.querySelector('table'));
workspace.querySelector('thead').innerHTML='<tr><th>Paciente / exame</th><th>Data do exame</th><th>Emissão</th><th>Convênio</th></tr>';
const summary=document.createElement('section');summary.className='finance-summary';root.querySelector('main').append(summary);
const money=n=>n.toLocaleString('pt-BR',{style:'currency',currency:'BRL'});const date=s=>s.split('-').reverse().join('/');
const feedback=root.querySelector('[role=status]');
function render(){const basis=Number(root.querySelector('[data-basis]').value),from=root.querySelector('[data-from]').value,to=root.querySelector('[data-to]').value,plan=root.querySelector('[data-plan]').value,type=root.querySelector('[data-type]').value,q=root.querySelector('input[type=search]').value.toLocaleLowerCase('pt-BR');const invalid=from&&to&&from>to;const rows=invalid?[]:data.filter(r=>(!from||r[basis]>=from)&&(!to||r[basis]<=to)&&(!plan||r[2]===plan)&&(!type||r[1]===type)&&(r[0]+' '+r[1]).toLocaleLowerCase('pt-BR').includes(q));feedback.textContent=invalid?'A data inicial deve ser anterior ou igual à data final.':'';workspace.querySelector('tbody').innerHTML=rows.map(r=>`<tr><td><span class="name">${r[0]}</span><div class="secondary">${r[1]}</div></td><td>${date(r[3])}</td><td>${date(r[4])}</td><td>${r[2]}</td></tr>`).join('')||'<tr><td colspan="4" class="empty">Nenhum exame neste filtro.</td></tr>';root.querySelector('.foot').textContent=rows.length+' exames · período aplicado à '+(basis===3?'data do exame':'data de emissão')+' · dados fictícios';summary.innerHTML='<div class="summary-title"><h3>Honorários por convênio</h3><button type="button" data-edit>Editar valores</button></div><div class="summary-row"><span>Convênio</span><span>Exames</span><span>Unitário</span><span>Subtotal</span></div>'+['Particular','Unimed'].map(plan=>{const group=rows.filter(r=>r[2]===plan);return group.length?`<div class="summary-row"><span>${plan}</span><span>${group.length}</span><span>${money(group[0][5])}</span><span>${money(group.reduce((s,r)=>s+r[5],0))}</span></div>`:'';}).join('')+`<div class="total-line"><span>Total de honorários</span><span>${money(rows.reduce((s,r)=>s+r[5],0))}</span></div><p class="secondary">Calculado sobre os exames filtrados. Não indica pagamento recebido.</p>`;}
controls.addEventListener('change',render);root.querySelector('input[type=search]').addEventListener('input',render);summary.addEventListener('click',e=>{if(e.target.closest('[data-edit]'))feedback.textContent='Editar valores — ação ilustrativa, disponível aqui no perfil autorizado.';});root.querySelector('.mobile-menu').addEventListener('click',e=>{const open=root.querySelector('.shell').classList.toggle('menu-open');e.currentTarget.setAttribute('aria-expanded',String(open));});render();if(globalThis.lucide)lucide.createIcons({attrs:{width:16,height:16}});
})();
</script>
