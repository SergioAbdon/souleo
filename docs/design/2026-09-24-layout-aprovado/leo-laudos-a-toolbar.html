<div class="shell roomy">

<defs><linearGradient id="ll-blue" x2="1" y2="1"><stop stop-color="#284f83"/><stop offset="1" stop-color="#2877ff"/></linearGradient><clipPath id="ll-trace"><path d="M17 153 H48 L68 113 L70 188 L87 159 H200" fill="none" stroke="white" stroke-width="3.5"/></clipPath></defs>
<g fill="url(#ll-blue)"><path d="M55 10 H128 L91 151 H202 L201 155 H85 L74 171 L72 95 L46 149 H18 Z"/><path d="M16 158 H50 L64 135 L66 202 L86 164 H198 L188 214 H0 Z"/></g>
<g fill="#1e3a5f" transform="translate(213 104) skewX(-12)"><path d="M0 0 H100 V23 H28 V43 H93 V65 H28 V87 H100 V110 H0 Z"/><path fill-rule="evenodd" d="M150 0 H202 Q232 0 232 29 V81 Q232 110 202 110 H150 Q120 110 120 81 V29 Q120 0 150 0 Z M158 23 Q148 23 148 35 V75 Q148 87 158 87 H194 Q204 87 204 75 V35 Q204 23 194 23 Z"/></g><g clip-path="url(#ll-trace)"><rect class="sweep" width="28" height="220" fill="#77aaff"/></g></svg>

<script>
(()=>{
const root=document.getElementById('leo-laudos-a-toolbar');
const patients=[['Ana Martins','62 anos','Eco transtorácico','08/09/2026'],['Beatriz Costa','47 anos','Doppler de carótidas','08/09/2026'],['Carlos Lima','54 anos','Eco transtorácico','08/09/2026'],['Helena Duarte','59 anos','Eco transtorácico','21/08/2026'],['João Fernandes','72 anos','Doppler de carótidas','15/08/2026'],['Marina Alves','51 anos','Eco transtorácico','12/08/2026'],['Paulo Ribeiro','68 anos','Eco transtorácico','08/09/2026'],['Rafael Souza','43 anos','ECG','01/09/2026']];
const icons=()=>{if(globalThis.lucide)lucide.createIcons({attrs:{width:16,height:16}});};
function render(){const query=root.querySelector('input[type=search]').value.toLocaleLowerCase('pt-BR');const selected=patients.filter(p=>(p[0]+' '+p[2]).toLocaleLowerCase('pt-BR').includes(query)&&(!root.querySelector('select').value||p[2]===root.querySelector('select').value));root.querySelector('tbody').innerHTML=selected.map(p=>`<tr><td><button type="button" class="action name" data-patient="${patients.indexOf(p)}">${p[0]}</button><div class="secondary">${p[1]}</div></td><td>${p[2]}<div class="acc">ACC DEMO-${String(patients.indexOf(p)+1).padStart(3,"0")}</div></td><td class="time">${p[3]}<div class="secondary">Médico demonstração</div></td><td><button type="button" class="action" data-demo="Ver PDF — ${p[0]}"><i data-lucide="file-text" aria-hidden="true"></i>Ver PDF</button><div class="secondary-actions"><button type="button" class="action" data-demo="Baixar PDF — ${p[0]}" aria-label="Baixar PDF"><i data-lucide="download" aria-hidden="true"></i></button><button type="button" class="action" data-demo="Imprimir — ${p[0]}" aria-label="Imprimir laudo"><i data-lucide="printer" aria-hidden="true"></i></button></div></td></tr>`).join('')||'<tr><td colspan="4" class="empty">Nenhum laudo encontrado.</td></tr>';root.querySelector('.foot').textContent=selected.length+' laudos emitidos · dados fictícios';icons();}
root.querySelector('input[type=search]').addEventListener('input',render);root.querySelector('select').addEventListener('change',render);
root.addEventListener('click',e=>{const button=e.target.closest('button');if(!button)return;if(button.dataset.patient!==undefined){const p=patients[Number(button.dataset.patient)];const detail=root.querySelector('.patient-detail');detail.hidden=false;detail.innerHTML=`<div class="detailhead"><div><h3>${p[0]}</h3><div class="sub">${p[1]} · Cadastro demonstrativo</div></div><button type="button" data-close aria-label="Fechar ficha"><i data-lucide="x" aria-hidden="true"></i></button></div><h4>Histórico de exames</h4><div class="history"><div><span class="name">${p[2]}</span><div class="secondary">${p[3]} · Clínica demonstração</div></div><span class="pill done">Emitido</span><button type="button" class="action" data-demo="Abrir PDF"><i data-lucide="file-text" aria-hidden="true"></i>Ver PDF</button></div>`;icons();detail.scrollIntoView({block:'nearest'});}if(button.hasAttribute('data-close'))root.querySelector('.patient-detail').hidden=true;if(button.dataset.demo)root.querySelector('#ll-feedback').textContent=button.dataset.demo+' — ação ilustrativa nesta prévia.';if(button.classList.contains('mobile-menu')){const open=root.querySelector('.shell').classList.toggle('menu-open');button.setAttribute('aria-expanded',String(open));}});
render();
})();
</script>

#leo-laudos-a-toolbar .acc{font-family:monospace;font-size:11px;color:#64748b;margin-top:6px}
#leo-laudos-a-toolbar .secondary-actions{display:flex;gap:8px}
#leo-laudos-a-toolbar .name{padding:0;font-size:14px;color:#1e3a5f;text-align:left}
#leo-laudos-a-toolbar .report-filters .extra-filter{max-width:180px}
#leo-laudos-a-toolbar[data-layout=b] table,#leo-laudos-a-toolbar[data-layout=b] tbody,#leo-laudos-a-toolbar[data-layout=c] table,#leo-laudos-a-toolbar[data-layout=c] tbody{display:block}
#leo-laudos-a-toolbar[data-layout=b] thead,#leo-laudos-a-toolbar[data-layout=c] thead{display:none}
#leo-laudos-a-toolbar[data-layout=b] tr,#leo-laudos-a-toolbar[data-layout=c] tr{display:grid;grid-template-columns:minmax(0,1fr) 160px 110px;gap:6px 20px;padding:22px;border-top:1px solid #e2e8f0;align-items:center}
#leo-laudos-a-toolbar[data-layout=b] td,#leo-laudos-a-toolbar[data-layout=c] td{padding:0;height:auto;border:0}
#leo-laudos-a-toolbar[data-layout=b] td:first-child,#leo-laudos-a-toolbar[data-layout=c] td:first-child{grid-column:1;grid-row:1}
#leo-laudos-a-toolbar[data-layout=b] td:nth-child(2),#leo-laudos-a-toolbar[data-layout=c] td:nth-child(2){grid-column:1;grid-row:2}
#leo-laudos-a-toolbar[data-layout=b] td:nth-child(3),#leo-laudos-a-toolbar[data-layout=c] td:nth-child(3){grid-column:2;grid-row:1/3}
#leo-laudos-a-toolbar[data-layout=b] td:last-child,#leo-laudos-a-toolbar[data-layout=c] td:last-child{grid-column:3;grid-row:1/3}
#leo-laudos-a-toolbar[data-layout=b] .name,#leo-laudos-a-toolbar[data-layout=c] .name{font-size:16px}
#leo-laudos-a-toolbar[data-layout=c] .workspace{background:transparent;border:0;box-shadow:none}
#leo-laudos-a-toolbar[data-layout=c] .searchrow,#leo-laudos-a-toolbar[data-layout=c] .report-filters{background:#fff}
#leo-laudos-a-toolbar[data-layout=c] tr{background:#fff;border:1px solid #e2e8f0;border-radius:12px;margin-top:14px}
@media(max-width:700px){#leo-laudos-a-toolbar[data-layout=b] tr,#leo-laudos-a-toolbar[data-layout=c] tr{grid-template-columns:minmax(0,1fr) 110px}#leo-laudos-a-toolbar[data-layout=b] td:nth-child(3),#leo-laudos-a-toolbar[data-layout=c] td:nth-child(3){grid-column:1;grid-row:3}#leo-laudos-a-toolbar[data-layout=b] td:last-child,#leo-laudos-a-toolbar[data-layout=c] td:last-child{grid-column:2;grid-row:1/4}}
</style>
<script>
(()=>{
const root=document.getElementById('leo-laudos-a-toolbar');root.dataset.layout='a';
const choices=document.createElement('div');choices.className='layout-choices';
[['a','A · Tabela detalhada'],['b','B · Paciente em destaque'],['c','C · Blocos de laudos']].forEach(([v,label])=>{const b=document.createElement('button');b.type='button';b.textContent=label;b.setAttribute('aria-pressed',String(v==='a'));b.onclick=()=>{root.dataset.layout=v;choices.querySelectorAll('button').forEach(x=>x.setAttribute('aria-pressed',String(x===b)));};choices.append(b);});root.prepend(choices);
const filters=root.querySelector('.report-filters');filters.querySelector('span').remove();
[['Período',['Todos os períodos','Setembro de 2026','Agosto de 2026']],['Convênio',['Todos os convênios','Particular','Unimed']]].forEach(([label,options])=>{const field=document.createElement('label');field.textContent=label+' ';const select=document.createElement('select');select.className='extra-filter';select.setAttribute('aria-label',label);options.forEach(value=>{const o=document.createElement('option');o.textContent=value;select.append(o);});field.append(select);filters.append(field);select.onchange=()=>{const feedback=root.querySelector('#ll-feedback');feedback.textContent=label+': '+select.value+' — filtro ilustrativo; a busca e o filtro de exame estão ativos nesta prévia.';};});
})();
</script>

<style>
#leo-laudos-a-toolbar .layout-choices{display:none}
#leo-laudos-a-toolbar .unified-toolbar{display:grid;grid-template-columns:minmax(150px,1.3fr) minmax(130px,1fr) minmax(120px,1fr) minmax(110px,.9fr);gap:8px;align-items:center;padding:16px;border-bottom:1px solid #e2e8f0;background:white}
#leo-laudos-a-toolbar .unified-toolbar .searchrow{padding:0;border:0;gap:8px;min-width:0}
#leo-laudos-a-toolbar .unified-toolbar label{min-width:0}
#leo-laudos-a-toolbar .unified-toolbar select{width:100%;max-width:none;min-width:0;padding:9px 7px;font-size:12px}
#leo-laudos-a-toolbar .unified-toolbar input{font-size:12px}
@media(max-width:850px){#leo-laudos-a-toolbar .unified-toolbar{grid-template-columns:repeat(3,minmax(0,1fr))}#leo-laudos-a-toolbar .unified-toolbar .searchrow{grid-column:1/-1;padding-bottom:8px}}
@media(max-width:450px){#leo-laudos-a-toolbar .unified-toolbar{grid-template-columns:1fr}#leo-laudos-a-toolbar .unified-toolbar select{font-size:14px}}
</style>
<script>
(()=>{const root=document.getElementById('leo-laudos-a-toolbar');const toolbar=document.createElement('div');toolbar.className='unified-toolbar';toolbar.setAttribute('aria-label','Busca e filtros de laudos');const search=root.querySelector('.searchrow');const filters=root.querySelector('.report-filters');root.querySelector('.workspace').prepend(toolbar);toolbar.append(search);filters.querySelectorAll('label').forEach(label=>{const select=label.querySelector('select');select.setAttribute('title',select.getAttribute('aria-label'));Array.from(label.childNodes).filter(n=>n.nodeType===3).forEach(n=>n.remove());toolbar.append(label);});filters.remove();})();
</script>
