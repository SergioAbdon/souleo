<script>
(()=>{
const root=document.getElementById('leo-integracoes-refinada'),panel=root.querySelector('.clinic-panel'),tabs=root.querySelector('.clinic-tabs');
const icon=n=>'<i data-lucide="'+n+'" aria-hidden="true"></i>';
const configs={feegow:{name:'Feegow',icon:'link',purpose:'Importação da agenda e associação dos procedimentos aos tipos de exame.',status:'Conectado · demonstração',fields:[['Identificação da conta','Clínica demonstração'],['Credencial de acesso','••••••••••••']],detail:'Mapeamento de procedimentos',rows:[['Ecocardiograma','Eco transtorácico'],['Eletrocardiograma','ECG']],action:'Editar mapeamentos'},orthanc:{name:'Orthanc',icon:'server',purpose:'Servidor que recebe e organiza as imagens DICOM dos aparelhos.',status:'Conectado · demonstração',fields:[['Servidor','Servidor de imagens da clínica'],['Endereço','Configurado · demonstração']],detail:'Recebimento de imagens',rows:[['Aparelho de ecocardiografia','Configurado'],['Associação ao paciente','Conferida pelo fluxo de integração']],action:'Configurar servidor'},wader:{name:'Wader',icon:'workflow',purpose:'Programa instalado na clínica que encaminha imagens e medidas ao LEO.',status:'Sem conexão · demonstração',fields:[['Instalação','Computador da clínica'],['Última comunicação','Sem informação nesta prévia']],detail:'Verificação da conexão',rows:[['Programa na clínica','Verificar se está em execução'],['Comunicação com o LEO','Aguardando conexão']],action:'Ver instruções'}};
function show(key){const c=configs[key];tabs.querySelectorAll('button').forEach(b=>b.setAttribute('aria-selected',String(b.dataset.key===key)));panel.innerHTML='<div class="connection-head"><div><h3>'+c.name+'</h3><div class="sub">'+c.purpose+'</div></div><span class="connection-status '+(key==='wader'?'off':'')+'">'+c.status+'</span></div><div class="clinic-grid">'+c.fields.map(([label,value])=>'<label>'+label+'<input readonly value="'+value+'"></label>').join('')+'</div><div class="clinic-actions"><button type="button" data-test>'+icon('cable')+'Testar conexão</button><button type="button" data-demo="Configurar '+c.name+'">'+icon('settings')+'Configurar</button></div><section class="connection-detail"><h4>'+c.detail+'</h4>'+c.rows.map(([a,b])=>'<div class="mapping"><span>'+a+'</span><span class="name">'+b+'</span></div>').join('')+'<div class="clinic-actions"><button type="button" data-demo="'+c.action+'">'+icon(key==='feegow'?'git-compare-arrows':'settings')+c.action+'</button></div></section><p class="clinic-note">Situações e configurações fictícias para avaliação do layout.</p>';panel.id='integration-panel';panel.setAttribute('role','tabpanel');panel.setAttribute('aria-labelledby','integration-'+key);if(globalThis.lucide)lucide.createIcons({attrs:{width:16,height:16}});}
Object.entries(configs).forEach(([key,c])=>{const b=document.createElement('button');b.type='button';b.dataset.key=key;b.id='integration-'+key;b.setAttribute('role','tab');b.setAttribute('aria-controls','integration-panel');b.innerHTML=icon(c.icon)+c.name;b.onclick=()=>show(key);tabs.append(b);});
root.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;const feedback=root.querySelector('[role=status]');if(b.hasAttribute('data-test'))feedback.textContent='Teste ilustrativo: nenhuma conexão externa foi realizada.';if(b.dataset.demo)feedback.textContent=b.dataset.demo+' — ação ilustrativa nesta prévia.';if(b.classList.contains('mobile-menu')){const open=root.querySelector('.shell').classList.toggle('menu-open');b.setAttribute('aria-expanded',String(open));}});show('feegow');
})();
</script>

<script>
(()=>{
const root=document.getElementById('leo-integracoes-refinada');const workspace=root.querySelector('.workspace');
const overview=document.createElement('section');overview.className='connection-overview';overview.setAttribute('aria-label','Visão geral das integrações — dados demonstrativos');
const activity={feegow:'Última sincronização: hoje, 09:42 · exemplo',orthanc:'Últimas imagens recebidas: hoje, 09:38 · exemplo',wader:'Última comunicação: hoje, 08:15 · exemplo'};
[['feegow','Feegow','Conectado'],['orthanc','Orthanc','Conectado'],['wader','Wader','Sem conexão']].forEach(([key,name,status])=>{const item=document.createElement('div');item.className='overview-item';item.innerHTML='<strong>'+name+'</strong><span class="connection-status '+(key==='wader'?'off':'')+'">'+status+'</span><span class="secondary">'+activity[key]+'</span>';const button=document.createElement('button');button.type='button';button.textContent=key==='wader'?'Verificar conexão':'Ver detalhes';button.onclick=()=>root.querySelector('[data-key='+key+']').click();item.append(button);overview.append(item);});workspace.before(overview);
function refine(){const panel=root.querySelector('.clinic-panel');if(panel.querySelector('.technical'))return;const key=root.querySelector('.clinic-tabs [aria-selected=true]').dataset.key;const last=document.createElement('div');last.className='last-activity';last.textContent=activity[key];panel.querySelector('.connection-head').after(last);
const grid=panel.querySelector('.clinic-grid');const actions=grid.nextElementSibling;const technical=document.createElement('details');technical.className='technical';const summary=document.createElement('summary');summary.textContent='Credenciais e configurações técnicas';technical.append(summary,grid);const config=actions.querySelector('[data-demo]');if(config)technical.append(config);panel.append(technical);
if(key==='wader'){const help=document.createElement('div');help.className='connection-help';help.innerHTML='<strong>O Wader está sem comunicação com o LEO.</strong><p>Confira se o computador da clínica está ligado, conectado à internet e com o Wader em execução.</p><button type="button" data-test>Testar novamente</button> <button type="button" data-instructions>Ver instruções</button><div class="instructions" hidden><p>1. Abra o Wader no computador da clínica.<br>2. Confira o indicador de conexão no programa.<br>3. Se continuar sem conexão, anote a mensagem exibida para o suporte.</p></div>';last.after(help);help.querySelector('[data-instructions]').onclick=()=>{const content=help.querySelector('.instructions');content.hidden=!content.hidden;};}}
refine();root.querySelector('.clinic-tabs').addEventListener('click',refine);
})();
</script>
