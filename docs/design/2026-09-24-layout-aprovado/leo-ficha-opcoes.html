<style>

<g fill="#1e3a5f" transform="translate(213 104) skewX(-12)"><path d="M0 0 H100 V23 H28 V43 H93 V65 H28 V87 H100 V110 H0 Z"/><path fill-rule="evenodd" d="M150 0 H202 Q232 0 232 29 V81 Q232 110 202 110 H150 Q120 110 120 81 V29 Q120 0 150 0 Z M158 23 Q148 23 148 35 V75 Q148 87 158 87 H194 Q204 87 204 75 V35 Q204 23 194 23 Z"/></g><g clip-path="url(#lp-trace)"><rect class="sweep" width="28" height="220" fill="#77aaff"/></g></svg>

<script>
(()=>{
const root=document.getElementById('leo-ficha-opcoes');
const patients=[['Ana Martins','62 anos','Eco transtorácico','08/09/2026'],['Beatriz Costa','47 anos','Doppler de carótidas','08/09/2026'],['Carlos Lima','54 anos','Eco transtorácico','08/09/2026'],['Helena Duarte','59 anos','Eco transtorácico','21/08/2026'],['João Fernandes','72 anos','Doppler de carótidas','15/08/2026'],['Marina Alves','51 anos','Eco transtorácico','12/08/2026'],['Paulo Ribeiro','68 anos','Eco transtorácico','08/09/2026'],['Rafael Souza','43 anos','ECG','01/09/2026']];
const icons=()=>{if(globalThis.lucide)lucide.createIcons({attrs:{width:16,height:16}});};
function render(){const query=root.querySelector('input[type=search]').value.toLocaleLowerCase('pt-BR');const selected=patients.filter(p=>p[0].toLocaleLowerCase('pt-BR').includes(query));root.querySelector('tbody').innerHTML=selected.map(p=>`<tr><td><span class="name">${p[0]}</span><div class="secondary">${p[1]}</div></td><td class="secondary">Não informado</td><td>${p[2]}</td><td class="time">${p[3]}</td><td><button type="button" class="action" data-patient="${patients.indexOf(p)}"><i data-lucide="user-round" aria-hidden="true"></i>Abrir ficha</button></td></tr>`).join('')||'<tr><td colspan="5" class="empty">Nenhum paciente encontrado.</td></tr>';root.querySelector('.foot').textContent=selected.length+' pacientes · dados fictícios';icons();}
root.querySelector('input[type=search]').addEventListener('input',render);
root.addEventListener('click',e=>{const button=e.target.closest('button');if(!button)return;if(button.dataset.patient!==undefined){const p=patients[Number(button.dataset.patient)];const detail=root.querySelector('.patient-detail');detail.hidden=false;root.querySelector(".workspace").hidden=true;root.querySelector(".pagehead").hidden=true;root.querySelector(".crumb").lastChild.textContent="Clínica demonstração / Pacientes / Ficha";detail.innerHTML=`<button type="button" data-close class="action"><i data-lucide="arrow-left" aria-hidden="true"></i>Voltar para pacientes</button><div class="detailhead"><div><h3>${p[0]}</h3><div class="sub">${p[1]} · Cadastro demonstrativo</div></div><button type="button" data-close aria-label="Fechar ficha"><i data-lucide="x" aria-hidden="true"></i></button></div><h4>Dados cadastrais</h4><div class="profile-fields"><div><span class="secondary">CPF</span><div>Não informado</div></div><div><span class="secondary">Telefone</span><div>Não informado</div></div><div><span class="secondary">E-mail</span><div>Não informado</div></div></div><button type="button" class="action" data-demo="Editar cadastro"><i data-lucide="pencil-line" aria-hidden="true"></i>Editar cadastro</button><h4>Histórico de exames · ficha única do paciente</h4><div class="history"><div><span class="name">${p[2]}</span><div class="secondary">${p[3]} · Clínica demonstração</div></div><span class="pill done">Emitido</span><button type="button" class="action" data-demo="Abrir PDF"><i data-lucide="file-text" aria-hidden="true"></i>Ver PDF</button></div><div class="history"><div><span class="name">Eletrocardiograma</span><div class="secondary">02/08/2026 · Clínica demonstração</div></div><span class="pill done">Emitido</span><button type="button" class="action" data-demo="Abrir PDF do ECG"><i data-lucide="file-text" aria-hidden="true"></i>Ver PDF</button></div><div class="history"><div><span class="name">Teste ergométrico</span><div class="secondary">18/06/2026 · Clínica demonstração</div></div><span class="pill done">Emitido</span><button type="button" class="action" data-demo="Abrir PDF do teste ergométrico"><i data-lucide="file-text" aria-hidden="true"></i>Ver PDF</button></div><div class="history"><div><span class="name">Holter 24 horas</span><div class="secondary">12/03/2026 · Clínica demonstração</div></div><span class="pill done">Emitido</span><button type="button" class="action" data-demo="Abrir PDF do Holter"><i data-lucide="file-text" aria-hidden="true"></i>Ver PDF</button></div>`;icons();detail.scrollIntoView({block:'nearest'});}if(button.hasAttribute('data-close')){root.querySelector('.patient-detail').hidden=true;root.querySelector('.workspace').hidden=false;root.querySelector('.pagehead').hidden=false;root.querySelector('.crumb').lastChild.textContent='Clínica demonstração / Pacientes';}if(button.dataset.demo)root.querySelector('#lp-feedback').textContent=button.dataset.demo+' — ação ilustrativa nesta prévia.';if(button.classList.contains('mobile-menu')){const open=root.querySelector('.shell').classList.toggle('menu-open');button.setAttribute('aria-expanded',String(open));}});

<style>

#leo-ficha-opcoes .patient-detail{padding:28px;border-radius:14px}
#leo-ficha-opcoes .profile-fields>div{display:grid;gap:6px}

#leo-ficha-opcoes .record-columns{display:grid;gap:28px;margin-top:28px}
#leo-ficha-opcoes .record-columns h4{margin-top:0}
#leo-ficha-opcoes .record-tabs{display:none;gap:8px;margin-top:24px;border-bottom:1px solid #e2e8f0;padding-bottom:12px}
#leo-ficha-opcoes[data-ficha=b] .record-columns{grid-template-columns:190px minmax(0,1fr);gap:28px}
#leo-ficha-opcoes[data-ficha=b] .registration{border-right:1px solid #e2e8f0;padding-right:24px}
#leo-ficha-opcoes[data-ficha=b] .profile-fields{grid-template-columns:1fr}
#leo-ficha-opcoes[data-ficha=c] .record-tabs{display:flex;flex-wrap:wrap}
#leo-ficha-opcoes .record-tabs button[aria-selected=true]{background:#eef2f8;border-color:#cad8ea;color:#1e3a5f}
#leo-ficha-opcoes[data-ficha=c][data-tab=history] .registration{display:none}

@media(max-width:760px){#leo-ficha-opcoes[data-ficha=b] .record-columns{grid-template-columns:1fr}#leo-ficha-opcoes[data-ficha=b] .registration{border-right:0;border-bottom:1px solid #e2e8f0;padding:0 0 20px}#leo-ficha-opcoes .patient-detail{padding:18px}}
</style>
<script>
(()=>{
const root=document.getElementById('leo-ficha-opcoes');
root.dataset.ficha='a';root.dataset.tab='history';
const choice=document.createElement('div');choice.className='ficha-choices';choice.setAttribute('aria-label','Opções da ficha');
[['a','A · Visão completa'],['b','B · Resumo lateral'],['c','C · Cadastro e exames em abas']].forEach(([value,label])=>{const b=document.createElement('button');b.type='button';b.textContent=label;b.setAttribute('aria-pressed',String(value==='a'));b.onclick=()=>{root.dataset.ficha=value;choice.querySelectorAll('button').forEach(x=>x.setAttribute('aria-pressed',String(x===b)));};choice.append(b);});root.prepend(choice);
function organize(){const detail=root.querySelector('.patient-detail');if(detail.querySelector('.record-columns'))return;const fields=detail.querySelector('.profile-fields');if(!fields)return;const registration=document.createElement('section');registration.className='registration';const history=document.createElement('section');history.className='exam-history';const headings=detail.querySelectorAll('h4');registration.append(headings[0],fields,detail.querySelector('[data-demo="Editar cadastro"]'));history.append(headings[1],...detail.querySelectorAll('.history'));const columns=document.createElement('div');columns.className='record-columns';columns.append(registration,history);const tabs=document.createElement('div');tabs.className='record-tabs';tabs.setAttribute('role','tablist');tabs.setAttribute('aria-label','Seções da ficha');[['registration','Dados cadastrais'],['history','Histórico de exames · 4']].forEach(([value,label])=>{const b=document.createElement('button');b.type='button';b.textContent=label;b.setAttribute('role','tab');b.setAttribute('aria-selected',String(value===root.dataset.tab));b.onclick=()=>{root.dataset.tab=value;tabs.querySelectorAll('button').forEach(x=>x.setAttribute('aria-selected',String(x===b)));};tabs.append(b);});detail.append(tabs,columns);}
organize();root.addEventListener('click',e=>{if(e.target.closest('[data-patient]'))organize();});
})();
</script>
