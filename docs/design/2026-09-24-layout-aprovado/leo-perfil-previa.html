#leo-perfil .clinic-panel h4{font-size:14px;color:#1e3a5f;margin:28px 0 18px}
#leo-perfil .clinic-grid{display:grid;grid-template-columns:1fr 1fr;gap:22px;margin:24px 0}
#leo-perfil .clinic-grid label{display:grid;gap:8px;font-size:13px;color:#526277}
#leo-perfil .clinic-grid input{border:1px solid #d5dfeb;border-radius:8px;padding:11px;color:#1e3a5f;width:100%;min-width:0}
#leo-perfil .clinic-row{display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;padding:20px 0;border-bottom:1px solid #e2e8f0}
#leo-perfil .clinic-row .lead{display:flex;gap:12px;align-items:center}
#leo-perfil .clinic-actions{display:flex;gap:10px;justify-content:flex-end;flex-wrap:wrap;margin-top:26px}
#leo-perfil .clinic-note{font-size:12px;color:#64748b;margin-top:20px}
@media(max-width:550px){#leo-perfil .clinic-grid{grid-template-columns:1fr}#leo-perfil .clinic-panel{padding:18px}}
</style>


<style>
#leo-perfil .profile-section{padding:4px 0 24px;margin-bottom:24px;border-bottom:1px solid #e2e8f0}
#leo-perfil .profile-section:last-of-type{border-bottom:0}
#leo-perfil .profile-section h3{font-size:16px}
#leo-perfil .clinic-grid select{font:inherit;width:100%;padding:11px;border:1px solid #d5dfeb;border-radius:8px;background:white;color:#1e3a5f}
#leo-perfil .profile-section .sub{font-size:12px}
#leo-perfil .clinic-actions[hidden]{display:none!important}
</style>
<script>
(()=>{
const root=document.getElementById('leo-perfil');root.querySelector('.clinic-tabs').remove();const panel=root.querySelector('.clinic-panel');panel.innerHTML='<section class="profile-section"><h3>Dados pessoais</h3><div class="clinic-grid"><label>Nome completo<input value="Médico demonstração"></label><label>Telefone<input type="tel" placeholder="Não informado"></label></div><label class="sub">E-mail da conta</label><div class="clinic-row"><span>medico@example.com</span><span class="secondary">Conta demonstrativa</span></div></section><section class="profile-section"><h3>Identificação profissional</h3><div class="sub">Dados utilizados na identificação do responsável pelos laudos.</div><div class="clinic-grid"><label>CRM<input placeholder="Número do CRM"></label><label>UF<select><option value="">Selecionar</option>PA<option>PA</option><option>SP</option><option>RJ</option><option>CE</option></select></label></div><div class="clinic-row"><div><span class="name">Assinatura</span><div class="secondary">Nenhuma imagem enviada nesta demonstração.</div></div><button type="button" data-demo="Enviar assinatura">Enviar assinatura</button></div></section><section class="profile-section"><h3>Acesso à conta</h3><div class="clinic-row"><div><span class="name">Senha</span><div class="secondary">Solicitar atualização da senha de acesso.</div></div><button type="button" data-demo="Alterar senha">Alterar senha</button></div></section><div class="clinic-actions" hidden><button type="button" class="primary" data-save>Salvar alterações</button></div><p class="clinic-note">Dados fictícios · prévia visual sem salvar no site.</p>';
const fields=Array.from(panel.querySelectorAll('input,select'));let values=fields.map(x=>x.value);function update(){panel.querySelector('.clinic-actions').hidden=!fields.some((x,i)=>x.value!==values[i]);}fields.forEach(x=>{x.addEventListener('input',update);x.addEventListener('change',update);});root.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;if(b.dataset.demo)root.querySelector('[role=status]').textContent=b.dataset.demo+' — ação ilustrativa.';if(b.hasAttribute('data-save')){values=fields.map(x=>x.value);update();root.querySelector('[role=status]').textContent='Salvamento simulado apenas nesta prévia.';}if(b.classList.contains('mobile-menu')){const open=root.querySelector('.shell').classList.toggle('menu-open');b.setAttribute('aria-expanded',String(open));}});
})();
</script>
